[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ibn"
version = "0.1.0"
description = "IBN Closed-Loop Feedback Control System — Phase 1"
requires-python = ">=3.11"
dependencies = [
    "neo4j>=5.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "jinja2>=3.1",
    "paramiko>=3.4",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "anyio>=4.0",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.package-dir]
"" = "src"
