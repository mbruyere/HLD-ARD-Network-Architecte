---
# IBN Full Stack — Phase 1
# Brings up: Neo4j + MinIO + Live-Memory in one command
#
# Run:  docker compose -f infra/docker-compose.stack.yml up -d
# Stop: docker compose -f infra/docker-compose.stack.yml down

services:
  # ── Tier 1: Neo4j SSoT ──────────────────────────────────────────────
  neo4j:
    image: neo4j:5-community
    container_name: ibn-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/ibn-closed-loop-2026
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "ibn-closed-loop-2026", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Tier 2: MinIO S3 ────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: ibn-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: ibn-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/ibn-live-memory &&
        echo 'Bucket ready'
      "

  # ── Tier 2: Live-Memory MCP ─────────────────────────────────────────
  live-memory:
    image: ghcr.io/cloud-temple/live-memory:latest
    container_name: ibn-live-memory
    ports:
      - "8002:8002"
    env_file:
      - ../.env
    environment:
      MCP_SERVER_PORT: 8002
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET_NAME: ibn-live-memory
      S3_REGION_NAME: us-east-1
    depends_on:
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  neo4j-data:
  neo4j-logs:
  minio-data:
