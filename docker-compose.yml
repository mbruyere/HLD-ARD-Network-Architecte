# IBN Closed-Loop Infrastructure
# Usage:
#   docker compose up -d                    — start all services
#   docker compose up -d redis              — start Redis only
#   docker compose up -d qdrant graph-memory — start Tier 3 only
#   docker compose down                     — stop all
#   docker compose logs -f graph-memory     — tail Graph-Memory logs
#
# Neo4j runs separately (see STEP1_Neo4j_Ontology_Bootstrap.md).
# Live-Memory runs separately (see STEP2_Live_Memory_Bootstrap.md).

version: "3.9"

services:

  # ── Redis 7 — Event Bus (Streams) ──────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ibn-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Qdrant — Vector DB for Graph-Memory embeddings ──────────────────────
  qdrant:
    image: qdrant/qdrant:v1.16.0
    container_name: ibn-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Embedding Proxy — local sentence-transformers + Anthropic chat proxy ─
  # Serves /v1/embeddings (all-MiniLM-L6-v2, padded to 1024-dim) and
  # proxies /v1/chat/completions to the Anthropic API.
  embedding-proxy:
    build: ./infra/embedding-proxy
    container_name: ibn-embedding-proxy
    restart: unless-stopped
    ports:
      - "8004:8004"
    environment:
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
      - EMBEDDING_DIM=1024
      - ANTHROPIC_URL=https://api.anthropic.com/v1
      - ANTHROPIC_KEY=${LLMAAS_API_KEY}
      - PORT=8004
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Graph-Memory MCP Server (Tier 3 — long-term knowledge graph) ────────
  # Built from https://github.com/Cloud-Temple/graph-memory (cloned locally).
  # Shares the same Neo4j instance as the SSoT.  All labels are prefixed
  # IBN_LIFECYCLE_ to avoid namespace collisions with the 9-layer ontology.
  graph-memory:
    image: ibn-graph-memory:local
    container_name: ibn-graph-memory
    restart: unless-stopped
    ports:
      - "8003:8002"
    environment:
      - NEO4J_URI=bolt://host.docker.internal:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-ibn-closed-loop-2026}
      - QDRANT_URL=http://host.docker.internal:6333
      - QDRANT_COLLECTION_PREFIX=ibn_lifecycle_
      - MCP_SERVER_PORT=8003
      - ADMIN_BOOTSTRAP_KEY=${GRAPH_MEMORY_TOKEN}
      - LLMAAS_API_URL=http://host.docker.internal:8004/v1
      - LLMAAS_API_KEY=${LLMAAS_API_KEY}
      - LLMAAS_MODEL=${LLMAAS_MODEL:-claude-haiku-4-5-20251001}
      - LLMAAS_EMBEDDING_MODEL=all-MiniLM-L6-v2
      - LLMAAS_EMBEDDING_DIMENSIONS=1024
      - S3_ENDPOINT_URL=http://host.docker.internal:9000
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadmin
      - S3_BUCKET_NAME=ibn-graph-memory
      - MCP_SERVER_DEBUG=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s

volumes:
  redis_data:
    driver: local
  qdrant_data:
    driver: local
